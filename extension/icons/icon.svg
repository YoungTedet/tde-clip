<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3b40"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6d8f"/>
      <stop offset="1" stop-color="#26364a"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6f52"/>
      <stop offset="1" stop-color="#4a3826"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d7f5a"/>
      <stop offset="1" stop-color="#2c412b"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9bff"/>
      <stop offset="1" stop-color="#0a6fe0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- pasek klatek -->
  <g>
    <rect x="196" y="372" width="196" height="200" rx="30" fill="url(#f1)"/>
    <rect x="414" y="372" width="196" height="200" rx="30" fill="url(#f2)"/>
    <rect x="632" y="372" width="196" height="200" rx="30" fill="url(#f3)"/>
  </g>
  <!-- zaznaczenie (jak w Final Cut) -->
  <g filter="url(#sh)">
    <rect x="388" y="336" width="248" height="272" rx="44" fill="#ffd60a" fill-opacity="0.14" stroke="#ffd60a" stroke-width="30"/>
    <rect x="374" y="420" width="30" height="104" rx="15" fill="#ffd60a"/>
    <rect x="620" y="420" width="30" height="104" rx="15" fill="#ffd60a"/>
  </g>
  <!-- strzałka w dół -->
  <g filter="url(#sh)">
    <circle cx="512" cy="742" r="92" fill="url(#arrow)"/>
    <path d="M512 692 V786 M470 748 L512 790 L554 748" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
